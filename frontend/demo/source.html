function empty(label,icon='package-open'){return `<div class="tg-empty"><i data-lucide="${icon}" aria-hidden="true"></i>${label}</div>`;}
function sorted(list){return [...list].sort((a,b)=>state.sort==='asc'?a.price-b.price:state.sort==='desc'?b.price-a.price:state.sort==='new'?Date.parse(b.createdAt)-Date.parse(a.createdAt):0);}

function openDetail(id){const p=product(id);if(!p)return;if(['buyer','store'].includes(state.page)){state.browsePage=state.page;state.browseAnchor=id;state.browseY=window.scrollY;}state.detailId=p.id;state.detailSku=variants(p).find(v=>sku(p,v.id).stock>0)?.id||variants(p)[0].id;state.detailQty=1;state.photo=0;go('detail');requestAnimationFrame(()=>root.scrollIntoView({block:'start'}));}

function shopForm(){return `<section class="tg-page" aria-label="填写开店申请"><div class="tg-section-head"><div><h2>申请开店</h2><p class="tg-muted">先给你的小店，准备一张名片。</p></div><span class="tg-muted">草稿自动保留</span></div><div class="tg-apply-layout"><aside class="tg-flow"><div class="tg-current">01　填写店铺资料</div><div>02　提交平台审核</div><div>03　开启店铺经营</div></aside><form id="tg-shop-form" class="tg-form-box" novalidate><h3>基本信息</h3><label class="tg-field" for="tg-shop-name">店铺名称</label><input id="tg-shop-name" data-shop-field="name" class="tg-input" value="${esc(state.shop.name)}" maxlength="20" placeholder="2–20 个字符"><span class="tg-field">店铺标识</span><div class="tg-logo-options" role="group" aria-label="选择店铺标识">${['orange','sage','ink'].map(t=>`<button type="button" data-shop-logo="${t}" class="cursor-interaction" aria-label="选择${({orange:'暖橙',sage:'绿色',ink:'蓝色'})[t]}店铺标识" aria-pressed="${state.shop.logo===t}"><span class="tg-shop-logo" data-tone="${t}">${esc(state.shop.name.slice(0,1)||'店')}</span></button>`).join('')}</div><label class="tg-field" for="tg-shop-category">主营类目</label><select id="tg-shop-category" class="tg-input" data-shop-field="category">${['家居日用','数码配件','户外用品'].map(c=>`<option ${state.shop.category===c?'selected':''}>${c}</option>`).join('')}</select><label class="tg-field" for="tg-shop-intro">店铺简介</label><textarea id="tg-shop-intro" class="tg-input" data-shop-field="intro" maxlength="200" placeholder="介绍一下你准备经营哪些好物，10–200 个字符。">${esc(state.shop.intro)}</textarea><label class="tg-check"><input type="checkbox" id="tg-shop-agree">已了解开店流程，确认提交以上演示资料</label><div class="tg-form-actions">${btn('提交开店申请','submit-shop',true)}${btn('保存并返回商城','save-shop')}</div><div class="tg-error" id="tg-shop-error" role="alert"></div></form></div></section>`;}
function auditMarkup(){return state.shopHistory.length?`<h3 style="margin-top:22px">申请与审核记录</h3><ol class="tg-timeline">${state.shopHistory.map(x=>`<li><div><strong>${esc(x.action)}</strong><p>${time(x.at)} · ${esc(x.actor)}</p>${x.remark?`<p>${esc(x.remark)}</p>`:''}</div></li>`).join('')}</ol>`:'';}
function progress(){const rejected=state.shopStage==='rejected',approved=state.shopStage==='approved';return `<section class="tg-page" aria-label="开店审核进度"><div class="tg-progress"><div class="tg-progress-symbol"><i data-lucide="${rejected?'file-pen-line':approved?'circle-check':'clock-3'}" aria-hidden="true"></i></div><h2>${rejected?'补充资料，让小店继续出发':approved?'开店申请已通过':'开店申请已提交'}</h2><p class="tg-muted">${rejected?'请根据审核意见修改后重新提交。':approved?'你的小店已经准备好了，开始发布商品吧。':'平台正在审核你的店铺资料，结果会同步到消息中心。'}</p><dl><dt>店铺名称</dt><dd>${esc(state.shop.name)}</dd><dt>主营类目</dt><dd>${esc(state.shop.category)}</dd><dt>提交时间</dt><dd>${time(state.shopSubmittedAt)}</dd><dt>当前状态</dt><dd class="tg-orange">${rejected?'待修改':approved?'审核通过':'待平台审核'}</dd>${rejected?`<dt>审核意见</dt><dd>${esc(state.rejectReason)}</dd>`:''}</dl>${auditMarkup()}<div class="tg-form-actions">${rejected?btn('修改并重新提交','revise-shop',true):approved?btn('进入店铺工作台','merchant-center',true):''}${btn('返回商城','back-buyer')}</div></div></section>`;}
function groupRows(rows){const groups=new Map();rows.forEach(r=>{const key=r.p.own?'own':r.p.store;if(!groups.has(key))groups.set(key,{key,name:r.p.store,rows:[]});groups.get(key).rows.push(r);});return [...groups.values()];}
function cartMarkup(full=false){const rows=cartRows(),valid=rows.filter(r=>!invalid(r)),chosen=selectedRows();return `${rows.length?groupRows(rows).map(g=>{const active=g.rows.filter(r=>!invalid(r)),picked=active.filter(r=>r.selected).length;return `<section class="tg-cart-group"><div class="tg-cart-store"><label><input type="checkbox" data-cart-group="${esc(g.key)}" aria-label="选择${esc(g.name)}全部有效商品" ${active.length&&picked===active.length?'checked':''} ${!active.length?'disabled':''} ${picked&&picked<active.length?'data-mixed="true"':''}>${esc(g.name)}</label></div>${g.rows.map(r=>{const {p,qty,id}=r,bad=invalid(r);return `<article class="tg-cart-line"><input type="checkbox" data-cart-check="${esc(id)}" aria-label="选择${esc(p.name)} ${esc(p.spec)}" ${r.selected&&!bad?'checked':''} ${bad?'disabled':''}><div class="tg-thumb" aria-hidden="true">${photoHtml(p)}</div><div><h3>${esc(p.name)}</h3><p class="tg-muted">${esc(p.spec)}</p><div class="tg-cart-controls"><span class="tg-orange">${money(p.price*qty)}</span><button type="button" data-qty="${esc(id)}" data-delta="-1" aria-label="减少${esc(p.name)}数量" class="cursor-interaction">−</button><span>${qty}</span><button type="button" data-qty="${esc(id)}" data-delta="1" aria-label="增加${esc(p.name)}数量" class="cursor-interaction">＋</button><button type="button" data-remove="${esc(id)}" class="tg-remove cursor-interaction">删除</button></div>${bad?`<div class="tg-invalid">${bad}${p.listed&&p.stock>0?`<br><button type="button" data-fix-qty="${esc(id)}" class="cursor-interaction">改为 ${p.stock} 件</button>`:''}</div>`:''}</div></article>`;}).join('')}</section>`;}).join(''):empty('购物车还是空的，去淘点喜欢的。','shopping-cart')}<label class="tg-cart-all"><input type="checkbox" data-cart-all="true" ${valid.length&&valid.every(r=>r.selected)?'checked':''} ${valid.some(r=>r.selected)&&!valid.every(r=>r.selected)?'data-mixed="true"':''} ${valid.length?'':'disabled'}>全选有效商品</label><div class="tg-cart-total"><span class="tg-muted">已选 ${chosen.reduce((n,r)=>n+r.qty,0)} 件 · ${groupRows(chosen).length} 家店</span><span class="tg-price" aria-live="polite">${money(total())}</span></div>${full&&rows.some(r=>invalid(r))?'<p class="tg-muted" style="margin-bottom:12px">失效和库存不足的商品不参与结算，请调整数量或移除。</p>':''}<div class="tg-drawer-actions">${!full?'<button type="button" data-go="cart" class="cursor-interaction">查看购物车</button>':''}<button type="button" data-go="checkout" class="tg-primary cursor-interaction" ${chosen.length?'':'disabled'}>去结算</button></div>`;}
function cartPage(){return `<section class="tg-page"><div class="tg-cart-page"><div class="tg-section-head"><div><h2>我的购物车</h2><p class="tg-muted">确认商品和数量，再去结算。</p></div></div>${cartMarkup(true)}</div></section>`;}
function auth(){return `<section class="tg-page tg-auth" aria-label="登录与注册"><div class="tg-auth-copy"><h2>淘点喜欢的，<br>也能开家自己的店。</h2><p>同一个账号，连接你的好物生活与小店经营。</p></div><form class="tg-form-box" id="tg-auth-form" novalidate autocomplete="off"><div class="tg-tabs">${[['login','账号登录'],['register','注册账号']].map(([v,t])=>`<button type="button" class="cursor-interaction" data-auth="${v}" aria-pressed="${authMode===v}">${t}</button>`).join('')}</div><h3>${authMode==='login'?'欢迎回到拾集':'开启你的好物日常'}</h3><label class="tg-field" for="tg-auth-account">账号</label><input id="tg-auth-account" class="tg-input" value="demo_buyer" maxlength="20" autocomplete="off"><label class="tg-field" for="tg-auth-password">密码</label><div class="tg-password"><input id="tg-auth-password" class="tg-input" type="password" maxlength="40" placeholder="演示密码：demo1234" autocomplete="new-password"><button type="button" data-action="password" aria-pressed="false" class="cursor-interaction">显示</button></div>${authMode==='register'?'<label class="tg-field" for="tg-auth-confirm">确认密码</label><input id="tg-auth-confirm" class="tg-input" type="password" maxlength="40" autocomplete="new-password" placeholder="再次输入演示密码">':''}<button type="button" id="tg-auth-submit" data-action="submit-auth" class="tg-primary tg-wide cursor-interaction">${authMode==='login'?'登录演示账号':'完成注册演示'}</button><div class="tg-error" id="tg-auth-error" role="alert">${esc(authError)}</div><p class="tg-muted">仅作界面演示，请勿输入真实密码。不会发送或保存密码。</p></form></section>`;}
function profile(){return `<section class="tg-page"><div class="tg-section-head"><div><h2>个人资料</h2><p class="tg-muted">昵称与头像会同步到商城和商家中心。</p></div></div><form id="tg-profile-form" class="tg-form-box" style="max-width:500px;margin:auto" novalidate><label class="tg-field" for="tg-profile-account">账号</label><input class="tg-input" id="tg-profile-account" value="demo_buyer" readonly><p class="tg-muted" style="margin-top:5px">用户 ID：U10001 · 演示</p><label class="tg-field" for="tg-profile-name">昵称</label><input class="tg-input" id="tg-profile-name" maxlength="12" value="${esc(state.nickname)}"><span class="tg-field">默认头像</span><div class="tg-logo-options" role="group" aria-label="选择头像">${['orange','sage','ink'].map(t=>`<button type="button" data-profile-tone="${t}" class="cursor-interaction" aria-label="选择${({orange:'暖橙',sage:'绿色',ink:'蓝色'})[t]}头像" aria-pressed="${draftTone===t}"><span class="tg-avatar" data-tone="${t}">${esc(state.nickname.slice(0,1))}</span></button>`).join('')}</div><div class="tg-form-actions">${btn('保存资料','submit-profile',true)}${btn('取消','cancel-profile')}</div><div class="tg-error" id="tg-profile-error" role="alert"></div></form></section>`;}
function syncMixed(){root.querySelectorAll('input[data-mixed]').forEach(el=>el.indeterminate=true);}
function add(id,amount=1,forceSku=false){const p=product(id);if(!p)return false;if(!id.includes('~')&&variants(p).length>1&&!forceSku){openDetail(p.id);return false;}const v=sku(p,id.split('~')[1]),key=v.key;if(!requireLogin({type:'add',id:key,amount,back:state.page}))return false;const qty=state.cart[key]||0;if(!p.listed||!Number.isInteger(amount)||amount<1||qty+amount>Math.min(99,v.stock)){announce('该规格已下架、库存不足或超过可购买数量。');if($('tg-detail-error'))$('tg-detail-error').textContent='购物车中已有 '+qty+' 件，当前库存 '+v.stock+' 件，请调整数量。';return false;}state.cart[key]=qty+amount;state.cartSelection[key]=true;updateRail();announce('已将「'+p.name+' · '+v.label+'」加入右侧购物车。');save();return true;}
function readShop(){state.shop.name=$('tg-shop-name').value.trim();state.shop.category=$('tg-shop-category').value;state.shop.intro=$('tg-shop-intro').value.trim();}
function submitShop(){readShop();if(state.shop.name.length<2||state.shop.name.length>20){$('tg-shop-error').textContent='店铺名称需要 2–20 个字符。';return;}if(state.shop.intro.length<10){$('tg-shop-error').textContent='请用至少 10 个字符介绍你的店铺。';return;}if(!$('tg-shop-agree').checked){$('tg-shop-error').textContent='请确认已了解开店流程。';return;}state.shopSubmittedAt=new Date().toISOString();recordShop(state.shopHistory.some(x=>x.action==='审核驳回')?'修改资料并重新提交':'提交开店申请',state.nickname);state.shopStage='pending';state.messagesRead=false;go('progress');announce('开店申请已提交，等待平台审核。');}
function submitProfile(){const nickname=$('tg-profile-name').value.trim();if(nickname.length<2||nickname.length>12){$('tg-profile-error').textContent='昵称需要 2–12 个字符。';return;}state.nickname=nickname;state.tone=draftTone;go(profileBack);announce('资料已保存，昵称和头像已同步。');}
function applyMerchantFilter(){state.merchantQuery=$('tg-merchant-query').value.trim().slice(0,40);state.merchantStatus=$('tg-merchant-status').value;render();save();}
function detailQuantity(){const n=Number($('tg-detail-qty')?.value||state.detailQty);if(!Number.isInteger(n)||n<1||n>99){if($('tg-detail-error'))$('tg-detail-error').textContent='请输入 1–99 的整数数量。';return null;}state.detailQty=n;return n;}
function buyNow(){const qty=detailQuantity();if(!qty)return;const p=product(state.detailId),v=sku(p,state.detailSku);if(!p.listed||qty>v.stock){$('tg-detail-error').textContent='当前规格库存不足，请调整数量。';return;}state.directPurchase={key:v.key,qty};if(!requireLogin({type:'direct'}))return;go('checkout');}

function photoId(p){return p.photos?.[0]||p.imageId||({ 'own-sample-tray':'box','own-sample-bag':'pencil-case','own-sample-cup':'mug' })[p.id]|| (mediaNames[p.id]||p.id==='stand'?p.id:'box');}
function photoHtml(p,id,alt=''){const key=id||photoId(p),src=media[key]||uploads.get(key);return src?'<img class="tg-photo" src="'+src+'" alt="'+esc(alt)+'">':'<span aria-hidden="true">'+(p.icon||'📦')+'</span>';}
function isAdminView(){return state.page==='admin'||(state.page==='order-detail'&&state.orderBack==='admin');}
function paymentFor(o){return state.payments.find(p=>p.id===o.paymentId);}
function statusOf(o){const pay=paymentFor(o);return pay?.status==='closed'?'已关闭':pay?.status==='pending'?'待付款':o.received?'已完成':o.shipped?'待收货':'待发货';}
function sku(p,id){const all=variants(p),v=all.find(x=>x.id===id)||all[0],key=p.id+'~'+v.id;return {...v,stock:state.stockOverrides[key]===undefined?v.stock:state.stockOverrides[key],key};}
function cartLine(id,qty){const p=product(id);if(!p)return null;const variantId=id.split('~')[1],exists=!variantId||variants(p).some(v=>v.id===variantId),v=sku(p,variantId);return {id,p:{...p,price:v.price,spec:exists?v.label:'该规格已停用',stock:exists?v.stock:0,listed:p.listed&&exists},qty,selected:state.cartSelection[id]!==false,key:exists?v.key:id};}

 const cleanProduct=p=>({...p,photos:(p.photos||[]).filter(id=>!id.startsWith('upload-'))});
 const snapshot={...state,ownProducts:state.ownProducts.map(cleanProduct),orders:state.orders.slice(0,10),payments:state.payments.slice(0,8),notifications:state.notifications.slice(0,12),shopHistory:state.shopHistory.slice(-8),adminLogs:state.adminLogs.slice(-6),reviewSamples:state.reviewSamples.map(a=>({...a,history:a.history.slice(-4)}))};
 const size=()=>new TextEncoder().encode(JSON.stringify(snapshot)).length;
 while(size()>14500&&snapshot.notifications.length>2)snapshot.notifications.pop();
 while(size()>14500&&snapshot.adminLogs.length)snapshot.adminLogs.shift();

 while(size()>14500&&snapshot.shopHistory.length>2)snapshot.shopHistory.shift();
 while(size()>14500&&snapshot.orders.some(o=>statusOf(o)!=='待付款')){

 }

 state.orders.filter(o=>o.paymentId===p.id).forEach(o=>{o.closedAt=p.closedAt;o.closedReason=reason;o.items.forEach(r=>{const item=product(r.productId);if(item&&variants(item).some(v=>v.id===r.skuId))state.stockOverrides[r.key]=sku(item,r.skuId).stock+r.qty;});});

}

function generateVariants(){
 readEditor();const parse=s=>[...new Set(s.split(/[,，、]/).map(x=>x.trim()).filter(Boolean))],colors=parse(editor.colors),sizes=parse(editor.sizes);
 if(!colors.length||!sizes.length||colors.length>3||sizes.length>3){$('tg-product-error').textContent='每组需填写 1–3 项规格。';return;}
 const old=editor.variants,hash=s=>Array.from(s).reduce((n,c)=>(n*31+c.charCodeAt(0))>>>0,7).toString(36);
 editor.variants=colors.flatMap(c=>sizes.map(z=>{const label=c+' · '+z;return old.find(v=>v.label===label)||{id:'v-'+hash(label),label,price:old[0]?.price||'',stock:20};}));editorDirty=true;render();
}
function submitProduct(draft=false){

 if(!draft&&!e.photos.length){$('tg-product-error').textContent='请至少选择一张商品图片。';return;}
 if(!draft&&e.variants.some(v=>!Number.isFinite(Number(v.price))||Number(v.price)<=0||Number(v.price)>99999||!Number.isInteger(Number(v.stock))||Number(v.stock)<0||Number(v.stock)>9999)){ $('tg-product-error').textContent='每种规格需填写有效价格与 0–9999 的整数库存。';return;}
 if(!e.id&&state.ownProducts.length>=12){$('tg-product-error').textContent='当前 Demo 最多保留 12 件店铺商品。';return;}
 if(!draft&&state.storeRestrictions.own){$('tg-product-error').textContent='店铺当前被平台停用，暂不能上架新商品。';return;}
 runMutation('tg-save-product','tg-product-error',()=>{
  const id=e.id||'own-'+Date.now(),vs=e.variants.map(v=>({...v,price:Math.round((Number(v.price)||0)*100)/100,stock:Math.max(0,Number(v.stock)||0)}));
  const p={id,name:e.name.trim()||'未命名商品草稿',category:e.category,description:e.description.trim(),photos:[...e.photos],variants:vs,price:Math.min(...vs.map(v=>v.price)),stock:vs.reduce((n,v)=>n+v.stock,0),spec:vs.length===1?vs[0].label:'多种规格可选',colors:e.colors,sizes:e.sizes,icon:'📦',draft,listed:!draft,createdAt:e.createdAt||new Date().toISOString()};

 },draft?'正在保存草稿…':'正在保存商品…');
}

  const setPixel=(name,value)=>{const next=Math.round(value)+'px';if(body.style.getPropertyValue(name)!==next)body.style.setProperty(name,next);};
  setPixel('--tg-follow-top',top);
  setPixel('--tg-drawer-max-height',Math.max(96,Math.min(visibleBottom,bodyBottom)-bodyTop-top-16));
  back.hidden=distance<viewportHeight*2;
  if(!back.hidden)setPixel('--tg-back-top-offset',Math.max(0,Math.min(visibleBottom,bodyBottom)-bodyTop-back.offsetHeight-16));
}
function initializeFollowingTools(){
  window.addEventListener('scroll',scheduleFollowingTools,{passive:true});
  window.addEventListener('resize',scheduleFollowingTools);
  window.addEventListener('message',event=>{
    const data=event.data;
    if(event.source!==window.parent||data?.type!=='tlg:viewport')return;
    if(!['top','bottom','height','scrollTop'].every(key=>Number.isFinite(data[key])&&data[key]>=0)||data.height<1||data.bottom<data.top)return;
    hostViewport={top:data.top,bottom:data.bottom,height:data.height,scrollTop:data.scrollTop};
    scheduleFollowingTools();
  });
  root.addEventListener('click',event=>{
    if(!event.target.closest('#tg-back-top'))return;
    event.preventDefault();event.stopImmediatePropagation();
    const behavior=window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth';
    if(hostViewport&&window.parent!==window)window.parent.postMessage({type:'tlg:scroll-top'},'*');
    else window.scrollTo({top:0,behavior});
  },true);
  if(window.parent!==window)window.parent.postMessage({type:'tlg:viewport-request'},'*');
  scheduleFollowingTools();
}
function focusSelector(el){if(!el)return '';if(el.id)return '#'+CSS.escape(el.id);for(const name of ['data-action','data-listing','data-delete-address','data-receive','data-remove','data-add','data-go','data-edit-product'])if(el.hasAttribute(name))return '['+name+'="'+CSS.escape(el.getAttribute(name))+'"]';return '';}
function placeOverlay(el,trigger){const box=root.getBoundingClientRect(),target=trigger?.isConnected?trigger.getBoundingClientRect():lastTrigger?.rect;const top=Math.max(12,Math.min((target?target.bottom-box.top+8:80),Math.max(12,root.offsetHeight-el.offsetHeight-12)));const left=Math.max(12,Math.min(target?target.left-box.left:12,root.clientWidth-el.offsetWidth-12));el.style.top=top+'px';el.style.left=left+'px';}
confirmationHtml=()=>'';
function renderConfirmation(){const el=$('tg-confirm');el.hidden=!confirmation;$('tg-shell').inert=!!confirmation;$('tg-demo-tools').inert=!!confirmation;if(!confirmation){el.innerHTML='';return;}el.innerHTML=`<h3 id="tg-confirm-title">${esc(confirmation.title)}</h3><p id="tg-confirm-description">${esc(confirmation.detail)}</p><div class="tg-form-actions">${btn('确认','confirm-action',true)}${btn('返回继续','cancel-confirm')}</div>`;placeOverlay(el,confirmation.trigger);}
askConfirmation=function(title,detail,run,cancel){confirmation={title,detail,run,cancel,trigger:lastTrigger?.element,selector:lastTrigger?.selector};renderConfirmation();const el=$('tg-confirm');el.scrollIntoView({block:'nearest'});el.querySelector('[data-action="cancel-confirm"]').focus({preventScroll:true});};
function finishConfirmation(accept){if(!confirmation)return;const c=confirmation;confirmation=null;renderConfirmation();if(accept)c.run?.();else c.cancel?.();const target=c.trigger?.isConnected?c.trigger:c.selector?root.querySelector(c.selector):null;if(target&&!target.disabled)target.focus({preventScroll:true});}
function hideToast(){clearTimeout(toastTimer);$('tg-toast').hidden=true;}
function showToast(text,undo=false){if(undoRemoval&&!undo)return;const el=$('tg-toast');clearTimeout(toastTimer);el.innerHTML=`<p>${esc(text)}</p><div class="tg-toast-actions">${undo?btn('撤销删除','undo-remove',true):''}${btn('关闭提示','dismiss-toast')}</div>`;el.hidden=false;placeOverlay(el,lastTrigger?.element);toastTimer=setTimeout(()=>{undoRemoval=null;hideToast();},undo?8000:3500);}
announce=function(text){v4.announce(text);if(/加入右侧购物车|已保存|已同步|已确认收货|操作未成功|平台处理已记录/.test(text))showToast(text);};
function removeCartItem(id){const qty=state.cart[id];if(!qty)return;undoRemoval={id,qty,selected:state.cartSelection[id]!==false,until:Date.now()+8000};delete state.cart[id];delete state.cartSelection[id];refreshCart();showToast('已删除「'+(product(id)?.name||'商品')+'」，8 秒内可撤销最近一次删除。',true);}
function undoRemove(){const record=undoRemoval;if(!record||record.until<Date.now()){undoRemoval=null;hideToast();return;}if(!product(record.id)){undoRemoval=null;showToast('该商品已不存在，无法恢复。');return;}const qty=(state.cart[record.id]||0)+record.qty;if(qty>99){undoRemoval=null;showToast('恢复后数量超过 99 件，请手动调整。');return;}state.cart[record.id]=qty;state.cartSelection[record.id]=record.selected;undoRemoval=null;refreshCart();showToast('已恢复商品；库存与可售状态以当前提示为准。');}
function ownStatus(p){return p.draft?'草稿':state.platformRestrictions[p.id]?'平台限制':state.storeRestrictions.own?'店铺停用':!p.listed?'已下架':variants(product(p.id)).every(v=>sku(product(p.id),v.id).stock===0)?'缺货':'在售';}
function merchantProducts(){const q=state.merchantQuery.trim();return state.ownProducts.filter(p=>(!q||p.name.includes(q))&&(state.merchantStatus==='全部'||ownStatus(p)===state.merchantStatus));}
function bulkResult(){return bulkReport?`<div class="tg-bulk-result" role="status"><strong>批量${bulkReport.label}：成功 ${bulkReport.rows.filter(r=>r.ok).length} 件，未处理 ${bulkReport.rows.filter(r=>!r.ok).length} 件</strong><details><summary class="cursor-interaction">查看逐项结果</summary><ul>${bulkReport.rows.map(r=>`<li>${esc(r.name)}：${r.ok?'成功':esc(r.reason)}</li>`).join('')}</ul></details></div>`:'';}
merchantTable=function(kind,orders){if(kind!=='products')return v4.merchantTable(kind,orders);const list=merchantProducts(),visible=new Set(list.map(p=>p.id));for(const id of bulkSelection)if(!visible.has(id))bulkSelection.delete(id);const all=list.length&&list.every(p=>bulkSelection.has(p.id)),mixed=bulkSelection.size>0&&!all;return merchantFilter(kind)+`<div class="tg-bulk-tools"><label><input type="checkbox" data-bulk-all="true" ${all?'checked':''} ${mixed?'data-mixed="true"':''} ${list.length?'':'disabled'}>全选当前结果</label><span id="tg-bulk-count">已选 ${bulkSelection.size} 件</span><button type="button" data-action="bulk-up" class="cursor-interaction" ${bulkSelection.size?'':'disabled'}>批量上架</button><button type="button" data-action="bulk-down" class="cursor-interaction" ${bulkSelection.size?'':'disabled'}>批量下架</button>${btn('清空选择','bulk-clear')}</div>${bulkResult()}<p class="tg-muted" style="margin-bottom:10px">共 ${list.length} 件商品</p>`+(list.length?`<div class="tg-table-scroll"><table class="tg-table"><thead><tr><th scope="col" class="tg-select-cell">选择</th>${['商品 / 规格','售价','可售库存','状态','操作'].map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${list.map(p=>`<tr><td class="tg-select-cell"><input type="checkbox" data-bulk-check="${p.id}" aria-label="选择商品${esc(p.name)}" ${bulkSelection.has(p.id)?'checked':''}></td><td><div class="tg-cell-product"><span class="tg-thumb">${photoHtml(p)}</span><div><strong>${esc(p.name)}</strong><span class="tg-muted">${variants(p).length} 种规格</span></div></div></td><td>${money(p.price)}${variants(p).length>1?' 起':''}</td><td>${variants(product(p.id)).reduce((n,v)=>n+sku(product(p.id),v.id).stock,0)}</td><td><span class="tg-badge">${ownStatus(p)}</span></td><td><button type="button" data-edit-product="${p.id}" class="cursor-interaction">编辑</button>${!p.draft?`<button type="button" data-listing="${p.id}" class="cursor-interaction" ${state.platformRestrictions[p.id]||state.storeRestrictions.own?'disabled':''}>${p.listed?'下架':'上架'}</button><button type="button" data-detail="${p.id}" class="cursor-interaction">预览</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:empty('没有符合条件的商品。')+btn('发布第一件商品','publish',true));};
function bulkListing(listed){if(!state.session||state.shopStage!=='approved'||!bulkSelection.size)return;const ids=[...bulkSelection],run=()=>{const rows=ids.map(id=>{const p=state.ownProducts.find(x=>x.id===id);let reason=!p?'商品已不存在':p.draft?'草稿请先编辑发布':state.storeRestrictions.own?'店铺已停用':state.platformRestrictions[id]?'商品被平台限制':p.listed===listed?(listed?'已经上架':'已经下架'):'';if(!reason&&listed){const vs=variants(product(id));if(!p.name||!p.description||vs.some(v=>!Number.isFinite(v.price)||v.price<=0||!Number.isInteger(sku(product(id),v.id).stock)||sku(product(id),v.id).stock<0))reason='请先补齐商品资料及有效价格、库存';}if(!reason){p.listed=listed;bulkSelection.delete(id);}return {id,name:p?.name||id,ok:!reason,reason};});bulkReport={label:listed?'上架':'下架',rows};render();save();$('tg-bulk-count')?.scrollIntoView({block:'nearest'});announce('批量'+bulkReport.label+'处理完成。');};askConfirmation('批量'+(listed?'上架':'下架')+' '+ids.length+' 件商品？',listed?'逐件核对状态；草稿、平台限制、资料或价格库存格式不符合要求的商品会说明原因。':'停止符合条件商品的新购买，已有订单继续履约；不符合条件的商品会说明原因。',run);}
render=function(){v4.render();const shop=state.page==='store';$('tg-search-form').hidden=!['buyer','store'].includes(state.page);$('tg-search').value=shop?state.storeQuery:state.query;$('tg-search').setAttribute('aria-label',shop?'搜索本店商品':'搜索商品');$('tg-search').placeholder=shop?'在'+storeMeta(state.storeName).name+'中搜索':'搜点好东西，例如：台灯';$('tg-search-button').textContent=shop?'搜本店':'搜索';$('tg-search-all').hidden=!shop;renderConfirmation();};
backBrowse=function(){const page=state.browsePage||'buyer',anchor=state.browseAnchor;go(page);requestAnimationFrame(()=>requestAnimationFrame(()=>{const el=Array.from(root.querySelectorAll('[data-product]')).find(el=>el.dataset.product===anchor);if(el)el.scrollIntoView({block:'center'});}));};
handleAction=function(a,b){switch(a){case 'apply-price':applyPrice();return;case 'reset-price':setContext({min:'',max:'',page:1});render();save();return;case 'clear-filters':setContext({q:'',category:'全部',min:'',max:'',sort:'default',page:1});scenario='normal';render();save();return;case 'search-all':search(true);return;case 'confirm-action':finishConfirmation(true);return;case 'cancel-confirm':finishConfirmation(false);return;case 'undo-remove':undoRemove();return;case 'dismiss-toast':undoRemoval=null;hideToast();return;case 'bulk-clear':bulkSelection.clear();render();return;case 'bulk-up':bulkListing(true);return;case 'bulk-down':bulkListing(false);return;case 'filter-merchant':case 'reset-merchant':bulkSelection.clear();bulkReport=null;break;}v4.handleAction(a,b);};
root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled||busy)return;lastTrigger={element:b,selector:focusSelector(b),rect:b.getBoundingClientRect()};let handled=true;if(b.dataset.category){setContext({category:b.dataset.category,page:1});render();save();$('tg-category-trigger')?.focus();}else if(b.dataset.sort){setContext({sort:b.dataset.sort,page:1});render();save();}else if(b.dataset.clear){setContext(b.dataset.clear==='query'?{q:'',page:1}:b.dataset.clear==='category'?{category:'全部',page:1}:{min:'',max:'',page:1});render();save();}else if(b.dataset.listPage){setContext({page:Number(b.dataset.listPage)});render();save();root.querySelector('.tg-products')?.scrollIntoView({block:'start'});}else if(b.dataset.remove){removeCartItem(b.dataset.remove);}else if(b.dataset.qty&&Number(b.dataset.delta)<0&&state.cart[b.dataset.qty]===1){removeCartItem(b.dataset.qty);}else if(b.dataset.store){if(state.page==='buyer'){state.browsePage='buyer';state.browseAnchor=b.closest('[data-product]')?.dataset.product||'';}if(state.storeName!==b.dataset.store){state.storeQuery='';state.storeCategory='全部';state.storeMin='';state.storeMax='';state.storeSort='default';state.storePage=1;}state.storeName=b.dataset.store;go('store');}else if(b.dataset.merchantTab){bulkSelection.clear();bulkReport=null;handled=false;}else handled=false;if(handled){event.preventDefault();event.stopImmediatePropagation();}},true);
function syncBulkControls(){const all=root.querySelector('[data-bulk-all]');if(!all)return;const list=merchantProducts();root.querySelectorAll('[data-bulk-check]').forEach(el=>el.checked=bulkSelection.has(el.dataset.bulkCheck));all.checked=!!list.length&&list.every(p=>bulkSelection.has(p.id));all.indeterminate=bulkSelection.size>0&&!all.checked;$('tg-bulk-count').textContent='已选 '+bulkSelection.size+' 件';root.querySelectorAll('[data-action="bulk-up"],[data-action="bulk-down"]').forEach(el=>el.disabled=!bulkSelection.size);}
root.addEventListener('change',event=>{const el=event.target;if(el.dataset.bulkCheck){const id=el.dataset.bulkCheck;if(el.checked)bulkSelection.add(id);else bulkSelection.delete(id);syncBulkControls();}else if(el.dataset.bulkAll){bulkSelection.clear();if(el.checked)merchantProducts().forEach(p=>bulkSelection.add(p.id));syncBulkControls();}});
root.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.closest('#tg-price-filter')){event.preventDefault();event.stopImmediatePropagation();applyPrice();}if(confirmation&&event.target.closest('#tg-confirm')&&event.key==='Tab'){const buttons=[...$('tg-confirm').querySelectorAll('button')],i=buttons.indexOf(document.activeElement);event.preventDefault();buttons[(i+(event.shiftKey?-1:1)+buttons.length)%buttons.length].focus();}},true);
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&confirmation){event.preventDefault();event.stopImmediatePropagation();finishConfirmation(false);}},true);

// Keep the previous bitmap only during an explicit gallery selection.
root.addEventListener('click',event=>{
  const button=event.target.closest('button[data-photo]');
  if(!button||button.disabled||busy||button.getAttribute('aria-pressed')==='true'||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const image=root.querySelector('.tg-gallery .tg-detail-art>.tg-photo:not(.tg-photo-previous)');
  if(!image)return;
  const previous=image.cloneNode(true),wasCropped=image.parentElement.dataset.crop==='true';
  requestAnimationFrame(()=>{
    const gallery=root.querySelector('.tg-gallery .tg-detail-art');
    if(!gallery||gallery===image.parentElement||typeof previous.animate!=='function')return;
    previous.classList.add('tg-photo-previous');
    previous.setAttribute('aria-hidden','true');previous.alt='';
    previous.style.transform=wasCropped?'scale(1.6)':'none';
    previous.style.objectFit=wasCropped?'cover':'contain';
    gallery.append(previous);
    const fade=previous.animate([{opacity:1},{opacity:0}],{duration:200,easing:'ease-out',fill:'forwards'});
    fade.finished.then(()=>previous.remove()).catch(()=>previous.remove());
  });
},true);
